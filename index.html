<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No Limits Tutorial Service — ECON1005 Final Exam Assessment</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:       #0a1f44;
      --navy-mid:   #122b5e;
      --navy-light: #1a3a7a;
      --navy-pale:  #e8edf7;
      --white:      #ffffff;
      --off-white:  #f4f6fb;
      --border:     #c8d2e8;
      --muted:      #5a6e99;
      --correct:    #0a5c36;
      --correct-bg: #e6f4ed;
      --wrong:      #7f1d1d;
      --wrong-bg:   #fde8e8;
      --skip:       #78350f;
      --skip-bg:    #fef3e2;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--navy);
      min-height: 100vh;
      color: var(--navy);
    }

    /* ── Header ── */
    #site-header {
      background: var(--navy);
      padding: 20px 24px 16px;
      text-align: center;
      border-bottom: 4px solid var(--white);
    }
    .header-inner {
      display: inline-flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .logo-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .logo-icon svg { width: 28px; height: 28px; }
    .header-text { text-align: left; }
    .brand-name {
      font-family: 'Playfair Display', serif;
      color: var(--white);
      font-size: clamp(1.1rem, 3vw, 1.55rem);
      line-height: 1.2;
      letter-spacing: 0.01em;
    }
    .brand-sub {
      color: rgba(255,255,255,0.75);
      font-size: clamp(0.8rem, 1.8vw, 0.95rem);
      margin-top: 2px;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .contact-bar {
      margin-top: 10px;
      display: inline-block;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 20px;
      padding: 5px 18px;
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      letter-spacing: 0.03em;
    }
    .contact-bar a {
      color: var(--white);
      font-weight: 700;
      text-decoration: none;
    }

    /* ── Main wrapper ── */
    #wrapper {
      max-width: 820px;
      margin: 28px auto 48px;
      padding: 0 16px;
    }

    /* ── Status bar ── */
    #status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--white);
      border-radius: 10px;
      padding: 11px 20px;
      margin-bottom: 12px;
      box-shadow: 0 2px 16px rgba(10,31,68,0.18);
    }
    #progress-text { font-size: 13px; color: var(--muted); font-weight: 500; }
    #timer-label {
      font-size: 16px;
      font-weight: 700;
      color: var(--navy);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.06em;
    }
    #timer-label.warn   { color: #b45309; }
    #timer-label.danger { color: #b91c1c; }

    .progress-track {
      height: 5px;
      background: rgba(255,255,255,0.2);
      border-radius: 3px;
      margin-bottom: 18px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--white);
      border-radius: 3px;
      transition: width 0.35s ease;
    }

    /* ── Scenario box ── */
    .scenario-box {
      background: var(--navy-pale);
      border-left: 4px solid var(--navy-light);
      border-radius: 0 10px 10px 0;
      padding: 13px 18px;
      margin-bottom: 12px;
      font-size: 14px;
      color: var(--navy);
      line-height: 1.65;
    }
    .sc-label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--navy-light);
      margin-bottom: 5px;
    }

    /* ── Question card ── */
    .q-card {
      background: var(--white);
      border-radius: 14px;
      padding: 24px 24px 20px;
      box-shadow: 0 4px 24px rgba(10,31,68,0.15);
    }
    .q-text {
      font-size: 15px;
      font-weight: 600;
      color: var(--navy);
      line-height: 1.65;
      margin-bottom: 18px;
    }
    .choices { display: flex; flex-direction: column; gap: 10px; }

    .choice-btn {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      background: var(--off-white);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      color: var(--navy);
      line-height: 1.5;
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      width: 100%;
    }
    .choice-btn:hover {
      border-color: var(--navy-light);
      background: var(--navy-pale);
      transform: translateX(3px);
    }
    .choice-btn.selected {
      background: var(--navy);
      border-color: var(--navy);
      color: var(--white);
      font-weight: 600;
    }
    .choice-letter {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-top: 1px;
    }
    .choice-btn.selected .choice-letter {
      background: rgba(255,255,255,0.2);
      color: var(--white);
    }

    /* ── Navigation ── */
    .nav {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    .nav button {
      flex: 1;
      padding: 11px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      border: 2px solid var(--white);
      background: transparent;
      color: var(--white);
    }
    .nav button:hover { background: rgba(255,255,255,0.15); }
    .nav button:active { transform: scale(0.98); }
    .nav button.primary {
      background: var(--white);
      color: var(--navy);
      border-color: var(--white);
    }
    .nav button.primary:hover { background: var(--navy-pale); }
    .nav button:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

    /* ── Results ── */
    .result-header {
      background: var(--white);
      border-radius: 14px;
      padding: 30px 24px;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: 0 4px 24px rgba(10,31,68,0.15);
    }
    .result-header .score {
      font-family: 'Playfair Display', serif;
      font-size: 52px;
      color: var(--navy);
    }
    .result-header .grade {
      font-size: 18px;
      color: var(--muted);
      margin-top: 6px;
      font-weight: 500;
    }
    .result-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .result-item {
      padding: 11px 16px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.55;
      border-left: 4px solid;
    }
    .result-item.ok    { border-color: var(--correct); color: var(--correct); background: var(--correct-bg); }
    .result-item.wrong { border-color: var(--wrong);   color: var(--wrong);   background: var(--wrong-bg); }
    .result-item.skip  { border-color: var(--skip);    color: var(--skip);    background: var(--skip-bg); }

    .restart-btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: var(--white);
      color: var(--navy);
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: background 0.15s;
    }
    .restart-btn:hover { background: var(--navy-pale); }

    /* ── Footer ── */
    #site-footer {
      text-align: center;
      padding: 20px 16px 32px;
      font-size: 13px;
      color: rgba(255,255,255,0.45);
    }
    #site-footer a { color: rgba(255,255,255,0.75); text-decoration: none; }

    @media (max-width: 520px) {
      .q-card { padding: 18px 16px; }
      .nav button { padding: 11px 12px; font-size: 13px; }
      #status-bar { padding: 10px 14px; }
      .header-text { text-align: center; }
    }
  </style>
</head>
<body>

  <div id="site-header">
    <div class="header-inner">
      <div class="logo-icon">
        <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="14" cy="14" r="13" fill="#0a1f44"/>
          <path d="M8 20 L14 8 L20 20" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="10" y1="16.5" x2="18" y2="16.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="header-text">
        <div class="brand-name">No Limits Tutorial Service</div>
        <div class="brand-sub">ECON1005 &nbsp;·&nbsp; Final Exam Assessment</div>
      </div>
    </div>
    <div>
      <div class="contact-bar">Contact us: <a href="tel:18765692703">1 (876) 569-2703</a></div>

  <div id="wrapper">
    <div id="status-bar">
      <span id="progress-text">Question 1 of 45</span>
      <span id="timer-label">30:00</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:2%"></div></div>
    <div id="quiz-body"></div>
  </div>

  <div id="site-footer">
    &copy; 2025 No Limits Tutorial Service &nbsp;|&nbsp; <a href="tel:18765692703">1 (876) 569-2703</a>
  </div>

  <script>
    const Q = [
      {q:"1. What would increase the margin of error?",choices:["Decrease confidence level","None","Increase population standard deviation","Decrease population standard deviation"],ans:2},
      {scenario:"A Ministry of Health survey divides Jamaica into 14 parishes. From each parish, 3 clinics are randomly selected. Then, 10 patients are randomly chosen from each selected clinic to participate in a national health study.",q:"2. Identify the sampling method used.",choices:["Census","Stratified Random Sample","Simple Random Sample","Cluster Sample","Multistage Sample"],ans:4},
      {scenario:"A university wants to collect data from every registered student in their system to assess the impact of online exams on GPA.",q:"3. Identify the data collection method used.",choices:["Census","Stratified Random Sample","Simple Random Sample","Cluster Sample","Multistage Sample"],ans:0},
      {scenario:"A research team classifies farmers based on the type of crops they grow (sugarcane, yam, banana, or coffee). They randomly select 20 farmers from each crop category for a study on climate change adaptation.",q:"4. Identify the sampling method used.",choices:["Census","Stratified Random Sample","Simple Random Sample","Cluster Sample","Multistage Sample"],ans:1},
      {scenario:"A government agency randomly selects 5 high schools across Jamaica and surveys all students in those schools about their views on mandatory national service.",q:"5. Identify the sampling method used.",choices:["Census","Stratified Random Sample","Simple Random Sample","Cluster Sample","Multistage Sample"],ans:3},
      {scenario:"A surveyor obtains a complete list of all small businesses registered in Jamaica. Using a random number generator, she selects 250 businesses for a study on financing and loan access.",q:"6. Identify the sampling method used.",choices:["Census","Stratified Random Sample","Simple Random Sample","Cluster Sample","Multistage Sample"],ans:2},
      {scenario:"Brandon owns a business that delivers fresh produce. The weekly revenue from sales is right-skewed, with a mean of $45,000 and a standard deviation of $5,200. A random sample of 49 weeks is taken.",q:"7. What can be said about the sampling distribution of the sample mean?",choices:["Right skewed, mean $45,000, SD $5,200","Right skewed, mean $45,000, SD $742.86","Normal, mean $45,000, SD $5,200","Normal, mean $45,000, SD $742.86","Cannot be determined"],ans:3},
      {q:"8. What level of measurement is a National ID number used to identify individuals in a government database?",choices:["Nominal","Ordinal","Interval","Ratio"],ans:0},
      {q:"9. What level of measurement is the performance rating of athletes (Excellent, Good, Fair, Poor)?",choices:["Nominal","Ordinal","Interval","Ratio"],ans:1},
      {q:"10. What level of measurement is the number of years an employee has worked with a company?",choices:["Nominal","Ordinal","Interval","Ratio"],ans:3},
      {scenario:"Random samples of size n are selected from a population with a known standard deviation.",q:"11. How is the standard deviation of the sampling distribution affected if sample size increases from 64 to 256?",choices:["Multiplied by 2","Divided by 4","Divided by 2","Remains the same","Multiplied by 4"],ans:2},
      {scenario:"The average number of patients seen daily at a medical clinic is 84, with a standard deviation of 10.2.",q:"12. You want to calculate the probability that a sample of 40 days will produce a mean greater than 87. What statistical procedure is this?",choices:["Probability Distribution","Sampling Distribution","Confidence Interval","Hypothesis Test","Sample Size Calculation"],ans:1},
      {scenario:"The Ministry of Education believes students today spend more time on mobile devices than the previous average of 4 hours daily. A study of 100 high school students is conducted to test whether today's average exceeds this.",q:"13. What statistical procedure is being described?",choices:["Probability Distribution","Sampling Distribution","Confidence Interval","Hypothesis Test","Sample Size Calculation"],ans:3},
      {scenario:"The average commute time in Kingston is 38 minutes with a standard deviation of 6 minutes.",q:"14. You want to determine the probability that a randomly selected person commutes more than 42 minutes. What statistical procedure is this?",choices:["Probability Distribution","Sampling Distribution","Confidence Interval","Hypothesis Test","Sample Size Calculation"],ans:0},
      {q:"15. Which measures would be most appropriate to describe the income for nurses in Jamaica?",choices:["Mean and Median","Median and IQR","IQR and Mode","Standard deviation and Mean"],ans:1},
      {scenario:"A polling agency wants to estimate the proportion of Jamaicans who support a new energy policy within ±2.5% of the true value with 95% confidence.",q:"16. What statistical procedure must they use to determine how many people to survey?",choices:["Probability Distribution","Sampling Distribution","Confidence Interval","Hypothesis Test","Sample Size Calculation"],ans:4},
      {scenario:"Elon Musk wants to estimate a proportion, allowing an error of no more than 3% with 90% confidence.",q:"17. What sample size should he use?",choices:["14","55","556","737","752"],ans:4},
      {scenario:"According to the Inland Revenue Service, 60% of Jamaican companies pay no taxes at the end of a financial year. A random sample of 300 Jamaican companies is taken.",q:"18. What is the Z value (to 4 decimal places) for finding the probability that the sample proportion exceeds 62%?",choices:["−0.7071","−0.7137","0.6200","0.7071","0.7137"],ans:3},
      {scenario:"Cam-Ron is a new sales representative at a competitive company. Company policy requires new reps to average more than US$1,000 per deal to be considered for permanent employment. The distribution of deals is normal with a standard deviation of US$120. A sample of 16 of Cam-Ron's deals yielded an average of US$1,080.",q:"19. If the company wants to predict the true average of Cam-Ron's sales deals within ±US$15, how many deals should they sample? (Use 95% confidence.)",choices:["67","173","174","245","246"],ans:4},
      {scenario:"Cam-Ron's probation is ending. Company policy requires new reps to average more than US$1,000 per deal to be made permanent. A sample of 16 deals yielded an average of US$1,080.",q:"20. What is the appropriate alternative hypothesis?",choices:["Hₐ: x̄ > 1080","Hₐ: μ > 1000","Hₐ: μ₀ > 1000","Hₐ: μ₀ > 1080","Hₐ: x̄ > 1000"],ans:1},
      {scenario:"Cam-Ron scenario continued. SD = US$120, n = 16, x̄ = US$1,080, H₀: μ = 1,000.",q:"21. What is the test statistic?",choices:["z = −2.67","z = −0.67","z = 0.67","z = 2.67"],ans:3},
      {scenario:"Cam-Ron scenario continued. For another sample of 16, the p-value was 0.0317. (Use α = 0.05.)",q:"22. What should the company conclude?",choices:["Not make Cam-Ron permanent — null hypothesis was rejected","Not make Cam-Ron permanent — null hypothesis was accepted","Make Cam-Ron permanent — alternative hypothesis was accepted","Make Cam-Ron permanent — null hypothesis was not rejected","Make Cam-Ron permanent — null hypothesis was rejected"],ans:4},
      {scenario:"In a survey of 763 adults, 329 said they would be interested in a trip to Mars.",q:"23. To estimate the true proportion wanting to visit Mars, p = _____.",choices:["329","0.43","763","1.96","Unknown"],ans:4},
      {scenario:"In a survey of 763 adults, 329 said they would be interested in a trip to Mars.",q:"24. In this survey, p̂ = _____.",choices:["329","0.43","763","1.96","Unknown"],ans:1},
      {scenario:"In a survey of 763 adults, 329 said they would be interested in a trip to Mars.",q:"25. In this survey, X = _____.",choices:["329","0.43","763","1.96"],ans:0},
      {scenario:"In a survey of 763 adults, 329 said they would be interested in a trip to Mars. (p̂ = 0.43, n = 763.)",q:"26. Which validity requirement for a confidence interval for a proportion is violated, if any?",choices:["np ≥ 10 and n(1 − p) ≥ 10","np̂ ≥ 10 and n(1 − p̂) ≥ 10","The population is at least 20 times as large as the sample","More than one condition is violated","No condition is violated"],ans:4},
      {q:"27. A 95% confidence interval for company employee income was calculated to be $100,000 to $400,000. What is the correct interpretation?",choices:["95% of all employees earn between $100,000 and $400,000","If 100 CIs are constructed with the same sample size, 95 will include the population mean","95% of the sample earns between $100,000 and $400,000","If 95 samples are taken, their average will be between $100,000 and $400,000","If 100 CIs are constructed, 95 will include the sample average"],ans:1},
      {q:"28. Which graph is best for representing per-capita GDP (rounded to nearest $'000) for 15 countries?",choices:["Histogram","Bar graph","Pie Chart","Boxplot","Stemplot"],ans:4},
      {q:"29. Which graph is best for representing a random sample of 60 students' majors?",choices:["Histogram","Bar graph","Pie Chart","Boxplot","Stemplot"],ans:1},
      {q:"30. Which graph is best for representing the percentage of a class scoring above 85% on an exam?",choices:["Histogram","Ogive","Pie Chart","Boxplot","Stemplot"],ans:1},
      {scenario:"A survey of 1,200 adults found that 312 plan to attend a paid carnival event.",q:"31. What is the centre of the 95% confidence interval for the proportion?",choices:["p","p̂ = 312 ÷ 1200","p̂ = 1200 ÷ 312","X = 312","n = 1200"],ans:1},
      {q:"32. What is the correct symbol and formula for the centre of a confidence interval for a proportion?",choices:["p = X ÷ n","p̂ = X ÷ n","p̂ = n ÷ X","p = n ÷ X","μ = X ÷ n"],ans:1},
      {q:"33. What is the correct critical value for a 95% confidence interval for a population proportion?",choices:["z = 1.28","z = 1.645","z = 1.96","z = 2.33","z = 2.58"],ans:2},
      {q:"34. What is the correct formula for the margin of error for a population proportion?",choices:["z × √(σ² ÷ n)","E = z × √(p̂(1 − p̂) ÷ n)","E = √(p̂ ÷ n)","E = z ÷ √n","E = p̂ ± z"],ans:1},
      {q:"35. A confidence interval for a proportion estimates:",choices:["The sample proportion","The population proportion","The population mean attendance","The probability of attending Carnival","The number of adults who attended Carnival"],ans:1},
      {q:"36. The lower and upper bounds of a confidence interval represent:",choices:["The range where 95% of sample values lie","The range where the population mean must fall","The range of likely values for the true population proportion","The range of the sample size","The probability of attending Carnival"],ans:2},
      {scenario:"A survey of 1,200 adults found that 312 plan to attend a paid carnival event. A 95% confidence interval is constructed.",q:"37. What population does this 95% confidence interval apply to?",choices:["Only the 1,200 sampled adults","Only the 312 who said yes","The entire adult population of Kingston","Only Carnival attendees","Only paid events in April"],ans:2},
      {scenario:"The Planning Institute of Jamaica (PIOJ) wants to determine the proportion of businesses that lost more than $1.5 million due to COVID-19.",q:"38. What is the appropriate hypothesis test?",choices:["A right tail proportions test","A two-tail means test","A right tail means test","A left tail proportions test","A left tail means test"],ans:0},
      {scenario:"A researcher surveys persons about how they feel when they listen to music, using a scale of 1 to 5.",q:"39. What is the best graphic method to represent this data?",choices:["Histogram","Bar chart","Pie chart","Stem and leaf plot"],ans:1},
      {scenario:"A student researcher surveyed a sample of persons aged 13–25 and concluded that most enjoyed Reggae music.",q:"40. What is this conclusion an example of?",choices:["A parameter","A statistic","A census","Inference","Sampling"],ans:3},
      {scenario:"The researcher asked volunteers in public spaces to participate in the music survey.",q:"41. What is the sampling method used?",choices:["Simple random sampling","Stratified random sampling","Cluster sampling","Multistage sampling","Voluntary sampling"],ans:4},
      {q:"42. Highest level of education is an example of a/an:",choices:["Nominal variable","Ordinal variable","Continuous variable","Interval variable","Ratio variable"],ans:1},
      {q:"43. Group type (student / full-time worker / unemployed, etc.) is an example of a/an:",choices:["Nominal variable","Ordinal variable","Continuous variable","Interval variable","Ratio variable"],ans:0},
      {scenario:"A student researcher visited public spaces and asked volunteers aged 13–25 questions about their music preferences and lifestyle.",q:"44. This survey is best described as an example of:",choices:["Anecdotal evidence","An observation","An experiment","Continuous data","Parameters"],ans:1},
      {q:"45. To show the percentage of persons earning less than $1.5 million per annum, the best graph is a:",choices:["Histogram","Bar chart","Pie chart","Less-than cumulative percentage ogive"],ans:3}
    ];

    const LETTERS=["A","B","C","D","E"];
    let current=0,userAns=[],timeLeft=1800,timerInt=null,ended=false;

    function fmt(s){const m=Math.floor(s/60),sec=s%60;return m+":"+(sec<10?"0":"")+sec;}

    function tick(){
      timeLeft--;
      const lbl=document.getElementById("timer-label");
      lbl.textContent=fmt(timeLeft);
      if(timeLeft<=300&&timeLeft>60)lbl.className="warn";
      else if(timeLeft<=60)lbl.className="danger";
      if(timeLeft<=0){clearInterval(timerInt);ended=true;for(let i=0;i<Q.length;i++){if(userAns[i]===undefined)userAns[i]=-1;}showResult();}
    }

    function updateProgress(idx){
      document.getElementById("progress-text").textContent="Question "+(idx+1)+" of "+Q.length;
      document.getElementById("progress-fill").style.width=((idx+1)/Q.length*100)+"%";
    }

    function renderQ(idx){
      if(ended)return;
      updateProgress(idx);
      const qo=Q[idx];
      let html="";
      if(qo.scenario){html+=`<div class="scenario-box"><span class="sc-label">Scenario</span>${qo.scenario}</div>`;}
      html+=`<div class="q-card"><div class="q-text">${qo.q}</div><div class="choices">`;
      qo.choices.forEach((c,i)=>{
        const sel=(userAns[idx]===i)?" selected":"";
        html+=`<button class="choice-btn${sel}" onclick="pick(${idx},${i})"><span class="choice-letter">${LETTERS[i]}</span><span>${c}</span></button>`;
      });
      html+=`</div></div><div class="nav">`;
      html+=`<button onclick="go(-1)" ${idx===0?"disabled":""}>← Previous</button>`;
      html+=idx<Q.length-1?`<button class="primary" onclick="go(1)">Next →</button>`:`<button class="primary" onclick="finish()">Submit Quiz</button>`;
      html+=`</div>`;
      document.getElementById("quiz-body").innerHTML=html;
    }

    function pick(idx,val){userAns[idx]=val;renderQ(idx);}

    function go(dir){
      if(dir===1&&userAns[current]===undefined){alert("Please select an answer before continuing.");return;}
      current+=dir;renderQ(current);
    }

    function finish(){
      if(userAns[current]===undefined){alert("Please select an answer before submitting.");return;}
      ended=true;clearInterval(timerInt);showResult();
    }

    function showResult(){
      document.getElementById("status-bar").style.display="none";
      document.querySelector(".progress-track").style.display="none";
      let score=0;
      Q.forEach((_,i)=>{if(userAns[i]===Q[i].ans)score++;});
      const pct=score/Q.length;
      const grade=pct>=0.9?"Outstanding! 🎉":pct>=0.7?"Good work! 👍":pct>=0.5?"Keep going! 📚":"More practice needed 💪";
      let html=`<div class="result-header"><div class="score">${score} / ${Q.length}</div><div class="grade">${grade}</div></div><div class="result-list">`;
      Q.forEach((qo,i)=>{
        const u=userAns[i],c=qo.ans;
        if(u===c)html+=`<div class="result-item ok">Q${i+1} ✓ Correct — ${qo.choices[u]}</div>`;
        else if(u===-1||u===undefined)html+=`<div class="result-item skip">Q${i+1} — Not answered | Correct: ${qo.choices[c]}</div>`;
        else html+=`<div class="result-item wrong">Q${i+1} ✗ Your answer: ${qo.choices[u]} | Correct: ${qo.choices[c]}</div>`;
      });
      html+=`</div><button class="restart-btn" onclick="restart()">Restart Quiz</button>`;
      document.getElementById("quiz-body").innerHTML=html;
    }

    function restart(){
      userAns=[];current=0;ended=false;timeLeft=1800;
      document.getElementById("status-bar").style.display="flex";
      document.querySelector(".progress-track").style.display="block";
      const lbl=document.getElementById("timer-label");
      lbl.textContent="30:00";lbl.className="";
      clearInterval(timerInt);timerInt=setInterval(tick,1000);
      renderQ(0);
    }

    timerInt=setInterval(tick,1000);
    renderQ(0);
  </script>
</body>
</html>
